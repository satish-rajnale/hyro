[project]
name = "hyro"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2", "sqlalchemy==2.0.40",
  "psycopg[binary]==3.2.6", "alembic==1.15.2", "pydantic-settings==2.8.1",
  "temporalio==1.11.1", "email-validator==2.2.0"
]
[project.optional-dependencies]
test = ["pytest==8.3.5", "httpx==0.28.1"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["hyro*"]
